# omnisense/omnistate with every source package, against the real registries:
#
#   cp .env.dist .env                                    # nothing is needed: the registries asked are open
#   docker compose run --rm omnistate bare               # plain PHP: no bundle, no container; a company, a VAT number, a domain; what PHP loaded
#   docker compose run --rm omnistate bare --recorded    # the answers kept in harness/recorded/ instead of the calls
#   docker compose run --rm omnistate test               # every package's tests
#   docker compose run --rm omnistate phpstan            # PHPStan, each package at the highest level
#
# Sources come from GitHub (branch 1.x) unless their checkout sits under
# OMNISTATE_PLUGINS (set it to ../.. in .env when this core sits in the
# workspace beside them): then that checkout is what runs. omnisense/contracts likewise: its
# checkout under OMNISENSE_CONTRACTS (../../../omnisense-contracts when it sits beside the
# family's folder), its tests run with the family's; GitHub (branch 1.x) otherwise.
name: omnistate-harness

services:
  omnistate:
    build: .
    image: omnisense/omnistate-harness
    # The image may be another harness tagged (PHP 8.4 with intl, zip and Composer): the
    # entrypoint and Composer's settings are named here, not taken from the image.
    entrypoint: ["/omnistate/core/docker/entrypoint.sh"]
    # One service, no server beside it: Docker's default bridge, no network of its own to create.
    network_mode: bridge
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_CACHE_DIR: /harness/.cache
    env_file:
      - path: .env
        required: false
    volumes:
      - ..:/omnistate/core
      - ${OMNISTATE_PLUGINS:-./plugins}:/omnistate/plugins:ro
      - ${OMNISENSE_CONTRACTS:-./contracts}:/omnisense/contracts:ro
      - harness:/harness

volumes:
  harness:
